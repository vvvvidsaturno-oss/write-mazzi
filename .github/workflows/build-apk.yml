name: Crea APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepara la cartella www con i file dell'app
        run: |
          mkdir www
          cp index.html app.js sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Installa Capacitor e crea il progetto Android
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "WRITE Mazzi" com.writemazzi.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Lascia lo spazio per barra di stato e barra di navigazione
        run: |
          cat > android/app/src/main/java/com/writemazzi/app/MainActivity.java <<'EOF'
          package com.writemazzi.app;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              View content = findViewById(android.R.id.content);
              content.setBackgroundColor(Color.parseColor("#140D08"));
              ViewCompat.setOnApplyWindowInsetsListener(content, (v, windowInsets) -> {
                Insets bars = windowInsets.getInsets(
                    WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                return WindowInsetsCompat.CONSUMED;
              });
            }
          }
          EOF

      - name: Usa il logo dell'app al posto di quello predefinito
        run: |
          res=android/app/src/main/res
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            rm -f $res/mipmap-$1/ic_launcher*.webp
            convert icon-512.png -resize $2x$2 $res/mipmap-$1/ic_launcher.png
            cp $res/mipmap-$1/ic_launcher.png $res/mipmap-$1/ic_launcher_round.png
            convert icon-maskable-512.png -resize $3x$3 $res/mipmap-$1/ic_launcher_foreground.png
          done
          cat > $res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#191108</color>
          </resources>
          EOF

      - name: Usa sempre la stessa chiave di firma (cosi' gli aggiornamenti non cancellano le carte)
        run: |
          mkdir -p ~/.android
          cp debug.keystore.txt ~/.android/debug.keystore

      - name: Aggiorna il numero di versione
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Compila l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WRITE-Mazzi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
